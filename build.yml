name: Publish Package to npmjs
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@nirojsapkota"
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: "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"
